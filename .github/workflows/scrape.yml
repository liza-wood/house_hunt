name: Daily RightMove refresh

on:
  schedule:
    # 17:00 UTC = 18:00 UK during BST (Apr-Oct), 17:00 UK during GMT (Nov-Mar).
    # If you only want 18:00 UK year-round, swap this to `0 17 * 4-10 *` + `0 18 * * *` etc.
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: |
          python -m scraper.main

      - name: Commit updated DB
        run: |
          git config user.name  "house-hunt-bot"
          git config user.email "house-hunt-bot@users.noreply.github.com"
          git add data/houses.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
